name: Deploy to Cloudflare Workers

# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers"
#                          template, plus D1 Edit and Workers R2 Storage Edit
#                          so the DB / bucket bindings resolve at deploy time.
#   CLOUDFLARE_ACCOUNT_ID  the account ID from the Cloudflare dashboard sidebar.
#
# Neither is needed to build; only the deploy step reads them.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; queued runs wait rather than cancelling a live rollout.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler.jsonc supplies name, main, assets and every binding.
          command: deploy
